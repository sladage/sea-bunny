[package]
name = "sea-bunny"
version = "0.1.0"
edition = "2024"

[dependencies]
eventful-rs = { git = "https://github.com/DreamLogics/eventful-rs", features = [
    "tokio",
    "slint",
] }
slint = { version = "1.18", features = ["default", "serde"] }
anyhow = "1.0"
serde = { version = "1.0.229", features = ["derive", "std"] }
reqwest = { version = "0.13", features = ["json", "multipart", "form", "query"] }
tokio = { version = "1.53", features = ["full"] }
keyring = { version = "4.2", features = ["v1"] }
toml = { version = "1.1", features = ["serde"] }
directories = "6.0.0"
url = { version = "2.5", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
open = { version = "5.4" }
serde_json = "1.0.151"
bitflags = { version = "2.13.2", features = ["serde"] }
percent-encoding = "2.3.2"

[build-dependencies]
slint-build = "1.18"
